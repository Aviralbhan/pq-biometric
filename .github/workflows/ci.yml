name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      # Tests use stub detectors and an in-process Redis (fakeredis); no weights or datasets needed.
      - run: pytest -q
